services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${PROJECT_NAME:-frappe-test-project}
    networks:
      - net
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - tailscale-data:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped
    depends_on:
      - frontend

configs:
  ts-serve:
    content: |
      {"TCP":{"80":{"TCPForward":"frontend:8080"}}}

volumes:
  tailscale-data:

